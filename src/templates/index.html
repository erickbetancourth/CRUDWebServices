<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body style="background-color: #15132C;">

    <h1 class="text-center mt-5 mb-5 text-primary">Python_CRUD</h1>

    <div class="container">
        <div class="card shadow" style="background-color: #27243D;">
            <div class="card-body">
                <form action="/user" method="POST">
                    <div class="row mb-3" style="color: #A2A0AC;">
                        <div class="col">
                            <label>Cedula</label>
                            <input type="text" class="form-control mb-3" name="id">
                        </div>
                        <div class="col">
                            <label>Nombre</label>
                            <input type="text" class="form-control mb-3" name="name">
                        </div>
                        <div class="col">
                            <label>Apellidos</label>
                            <input type="text" class="form-control mb-3" name="lastname">
                        </div>
                        <div class="col">
                            <label>Correo</label>
                            <input type="text" class="form-control mb-3" name="email">
                        </div>
                        <div class="col">
                            <label>Telefono</label>
                            <input type="text" class="form-control mb-3" name="phone">
                        </div>
                        <div class="col">
                            <button class="btn btn-primary mb-3 mt-4" type="submit">Guardar</button>
                        </div>
                    </div>
                </form>

                <!-- Tabla -->

                <table class="table table-bordered">
                    <thead>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Cedula</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Nombre</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Apellidos</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Correo</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Telefono</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Rol</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Estado</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Editar</th>
                        <th scope="col" style="background-color: #3A374E; color: aliceblue;">Eliminar</th>
                    </thead>
                    <tbody>
                        {% for d in data %}
                            <tr>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.ID}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Nombre}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Apellidos}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Correo}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Telefono}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Rol}}</td>
                                <td style="background-color: #615E72; color: aliceblue;">{{d.Estado}}</td>
                                <td style="background-color: #615E72; color: aliceblue;"><button class="btn btn-primary btn-sm" id="btn-edit{{d.ID}}" data-bs-toggle="modal" data-bs-target="#modal{{d.ID}}">Editar</button></td>
                                <td style="background-color: #615E72; color: aliceblue;"><a href="{{url_for('delete', id=d.ID)}}" class="btn btn-danger btn-sm">Eliminar</a></td>
                            </tr>

                            <!-- modal -->
                             <div class="modal fade" id="modal{{d.ID}}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="exampleModalLabel">{{d.Name}}</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form action="/edit/{{d.ID}}" method="post">
                                            <label>Cedula</label>
                                            <input type="text" class="form-control mb-3" name="id" value="{{d.ID}}">
                                            <label>Nombre</label>
                                            <input type="text" class="form-control mb-3" name="name" value="{{d.Nombre}}">
                                            <label>Apellidos</label>
                                            <input type="text" class="form-control mb-3" name="lastname" value="{{d.Apellidos}}">
                                            <label>Correo</label>
                                            <input type="text" class="form-control mb-3" name="email" value="{{d.Correo}}">
                                            <label>Telefono</label>
                                            <input type="text" class="form-control mb-3" name="phone" value="{{d.Telefono}}">
                                            <label>Rol</label>
                                            <input type="text" class="form-control mb-3" name="role">
                                            <label>Estado</label>
                                            <input type="text" class="form-control mb-3" name="status">
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-primary">Save changes</button>
                                    </div>
                                    </form>
                                    </div>
                                </div>
                                </div>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
</body>
</html>
